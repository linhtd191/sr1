<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lock Screen</title>
<style>
:root{ --radius:52px; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
html,body{height:100%}
body{background:#000;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}
.phone{position:relative;width:100vw;height:100dvh;overflow:hidden;
  background:
    radial-gradient(130% 80% at 50% -10%, #3a3a52 0%, transparent 60%),
    radial-gradient(120% 90% at 50% 110%, #1a2a4a 0%, transparent 60%),
    linear-gradient(180deg,#0b0e1a,#05060c);}
@media (min-width:520px){
  .phone{width:390px;height:844px;border-radius:var(--radius);
    border:12px solid #0a0a0a;box-shadow:0 0 0 2px #2a2a2a,0 40px 90px rgba(0,0,0,.7)}
  .island{display:block!important}
}
.island{display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:118px;height:34px;background:#000;border-radius:20px;z-index:50}
.sbar{position:absolute;top:0;left:0;right:0;height:52px;padding:18px 32px 0;
  display:flex;justify-content:space-between;font-size:15px;font-weight:600;z-index:40;pointer-events:none}
.sbar .ic{display:flex;gap:6px;align-items:center}
.bat{width:25px;height:12px;border:1.5px solid #fff;border-radius:4px;padding:1.5px;position:relative}
.bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:#fff;border-radius:1px}
.bat i{display:block;height:100%;width:85%;background:#fff;border-radius:2px}

/* ---- LOCK ---- */
#lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:88px;transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .4s}
.owner{font-size:17px;opacity:.85;display:flex;align-items:center;gap:7px}
.owner .lk{font-size:15px}
.clock{font-size:92px;font-weight:600;letter-spacing:-2px;line-height:1.05;margin-top:4px}
.day{font-size:19px;opacity:.9;margin-top:2px;text-transform:capitalize}
#lock .swipe{position:absolute;bottom:46px;font-size:15px;opacity:.75;animation:bob 2.2s infinite;cursor:pointer;text-align:center}
#lock .bar{width:134px;height:5px;border-radius:3px;background:#fff;margin:10px auto 0}
@keyframes bob{50%{transform:translateY(-7px)}}

/* ---- PASSCODE ---- */
#pass{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:96px;
  background:rgba(10,12,22,.55);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  opacity:0;pointer-events:none;transition:opacity .4s}
#pass.show{opacity:1;pointer-events:auto}
#pass .owner2{font-size:16px;opacity:.8;margin-bottom:6px}
#pass h2{font-size:21px;font-weight:500}
#pass .msg{font-size:13px;opacity:.7;margin-top:8px;height:16px}
.dots{display:flex;gap:24px;margin:26px 0 54px}
.dots span{width:13px;height:13px;border:1.5px solid #fff;border-radius:50%;transition:background .15s}
.dots span.on{background:#fff}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:18px 28px}
.pad button{width:76px;height:76px;border-radius:50%;border:0;color:#fff;cursor:pointer;
  background:rgba(255,255,255,.14);backdrop-filter:blur(4px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .12s}
.pad button .n{font-size:33px;font-weight:300}
.pad button .l{font-size:10px;letter-spacing:2px;margin-top:3px;font-weight:600;opacity:.9}
.pad button:active{background:rgba(255,255,255,.32)}
.pad .blank{background:none;pointer-events:none}
.pass-foot{position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:space-between;padding:0 46px;font-size:17px}
.pass-foot button{background:none;border:0;color:#fff;font-size:17px;cursor:pointer;opacity:.95}

/* ---- UNLOCKED CONTENT ---- */
#home{position:absolute;inset:0;padding:78px 24px 40px;overflow-y:auto;opacity:0;pointer-events:none;
  transition:opacity .5s;transform:scale(1.05)}
#home.show{opacity:1;pointer-events:auto;transform:scale(1)}
.avatar{width:104px;height:104px;border-radius:50%;margin:4px auto 14px;display:grid;place-items:center;
  font-size:48px;background:linear-gradient(135deg,#5b8cff,#8e7cff);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
#home h1{font-size:27px;font-weight:700;text-align:center}
#home .role{text-align:center;opacity:.6;font-size:15px;margin:2px 0 22px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:15px 17px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:5px}
.card p{font-size:14px;opacity:.75;line-height:1.5}
.links{display:flex;flex-direction:column;gap:10px}
.links a{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px}
.links a .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none;background:rgba(255,255,255,.12)}
.links a .ar{margin-left:auto;opacity:.4}
.relock{display:block;margin:20px auto 0;background:none;border:1px solid rgba(255,255,255,.2);color:#fff;
  padding:10px 22px;border-radius:22px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="sbar"><span id="sbTime">9:41</span><span class="ic">▂▄▆█ 5G <span class="bat"><i></i></span></span></div>

  <!-- LOCK -->
  <section id="lock">
    <div class="owner"><span class="lk">🔒</span><span id="ownerName"></span></div>
    <div class="clock" id="clock"></div>
    <div class="day" id="day"></div>
    <div class="swipe" id="swipe">Vuốt lên để mở khóa<div class="bar"></div></div>
  </section>

  <!-- PASSCODE -->
  <section id="pass">
    <div class="owner2" id="ownerName2"></div>
    <h2>Nhập mật mã</h2>
    <div class="msg" id="msg"></div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <div class="pass-foot">
      <button id="emergency">Khẩn cấp</button>
      <button id="cancel">Hủy</button>
    </div>
  </section>

  <!-- UNLOCKED -->
  <section id="home">
    <div class="avatar" id="avatar">🧑‍💻</div>
    <h1 id="homeName"></h1>
    <div class="role" id="homeRole"></div>
    <div class="card"><p id="homeAbout"></p></div>
    <div class="links" id="links"></div>
    <button class="relock" id="relock">Khóa lại</button>
  </section>
</div>

<script>
/* ===== CHỈNH THÔNG TIN Ở ĐÂY ===== */
const CONFIG = {
  owner: "iPhone của Bạn",       // tên hiện trên màn khóa
  name: "Tên Của Bạn",
  role: "Lập trình viên",
  avatar: "",                     // link ảnh, để trống = emoji
  passcode: "1234",               // mật mã (4 hoặc 6 số)
  showHint: true,                 // hiện gợi ý mật mã
  about: "Chào bạn! Đây là trang giới thiệu của mình. Mở khóa để xem thông tin liên hệ nhé.",
  links: [
    { ic:"🐙", label:"GitHub",   url:"https://github.com/" },
    { ic:"💼", label:"LinkedIn", url:"https://linkedin.com/" },
    { ic:"✉️", label:"Email",    url:"mailto:ban@example.com" },
    { ic:"📘", label:"Facebook", url:"https://facebook.com/" },
  ],
};
/* ================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("#ownerName").textContent = CONFIG.owner;
$("#ownerName2").textContent = CONFIG.owner;

/* đồng hồ */
function tick(){
  const d = new Date();
  const t = d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",hour12:false});
  $("#clock").textContent = t; $("#sbTime").textContent = t;
  $("#day").textContent = d.toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick,1000);

/* màn khóa -> passcode */
const lock = $("#lock");
function toPass(){ lock.style.transform="translateY(-100%)"; lock.style.opacity="0"; $("#pass").classList.add("show"); setTimeout(()=>$("#t0")?.focus(),100); }
$("#swipe").onclick = toPass;
let sy=null;
lock.addEventListener("pointerdown",e=>{sy=e.clientY;lock.style.transition="none"});
window.addEventListener("pointermove",e=>{ if(sy===null)return; const dy=Math.min(0,e.clientY-sy);
  lock.style.transform=`translateY(${dy}px)`; lock.style.opacity=1+dy/400; });
window.addEventListener("pointerup",e=>{ if(sy===null)return; const dy=e.clientY-sy; sy=null;
  lock.style.transition=""; if(dy<-70){toPass()} else {lock.style.transform="";lock.style.opacity=""} });

/* passcode */
const LEN = CONFIG.passcode ? CONFIG.passcode.length : 4;
let code="";
$("#msg").textContent = CONFIG.showHint && CONFIG.passcode ? `Gợi ý: ${CONFIG.passcode}` : "";
const dots = () => $("#dots").innerHTML = Array.from({length:LEN},(_,i)=>`<span class="${i<code.length?'on':''}"></span>`).join("");
dots();
const L=["","ABC","DEF","GHI","JKL","MNO","PQRS","TUV","WXYZ"];
$("#pad").innerHTML = [1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}"><span class="n">${n}</span><span class="l">${L[n-1]}</span></button>`).join("")
  + `<span class="blank"></span><button data-n="0"><span class="n">0</span></button><span class="blank"></span>`;
$("#pad").addEventListener("click",e=>{
  const b=e.target.closest("button[data-n]"); if(!b)return;
  code+=b.dataset.n; dots();
  if(code.length===LEN) setTimeout(()=>{
    if(!CONFIG.passcode || code===CONFIG.passcode) unlock();
    else{ const d=$("#dots"); d.classList.add("shake"); setTimeout(()=>d.classList.remove("shake"),400);
      if(navigator.vibrate)navigator.vibrate(180);
      $("#msg").textContent="Sai mật mã, thử lại"; setTimeout(()=>$("#msg").textContent = CONFIG.showHint&&CONFIG.passcode?`Gợi ý: ${CONFIG.passcode}`:"",1500); }
    code=""; dots();
  },140);
});
$("#cancel").onclick = ()=>{ code="";dots(); $("#pass").classList.remove("show"); lock.style.transform="";lock.style.opacity=""; };
$("#emergency").onclick = ()=>{ $("#msg").textContent="Đây chỉ là trang demo 🙂"; setTimeout(()=>$("#msg").textContent = CONFIG.showHint&&CONFIG.passcode?`Gợi ý: ${CONFIG.passcode}`:"",2000); };

/* mở khóa -> nội dung */
function unlock(){
  $("#pass").classList.remove("show");
  $("#avatar").innerHTML = CONFIG.avatar?`<img src="${esc(CONFIG.avatar)}" alt="">`:"🧑‍💻";
  $("#homeName").textContent = CONFIG.name;
  $("#homeRole").textContent = CONFIG.role;
  $("#homeAbout").textContent = CONFIG.about;
  $("#links").innerHTML = CONFIG.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener"><span class="ic">${l.ic}</span>${esc(l.label)}<span class="ar">›</span></a>`).join("");
  $("#home").classList.add("show");
}
$("#relock").onclick = ()=>{ $("#home").classList.remove("show"); lock.style.transform="";lock.style.opacity=""; };
</script>
</body>
</html>
